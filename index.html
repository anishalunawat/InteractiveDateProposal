<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A very important question</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:grid;place-items:center;padding:20px;
       font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:radial-gradient(circle at 20% 20%,#3b1d33,#150d17 60%);color:#f6ecec}
  .card{display:none;width:100%;max-width:440px;background:rgba(255,255,255,.05);
        border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:28px;
        backdrop-filter:blur(8px);text-align:center;animation:in .4s ease}
  .card.on{display:block}
  @keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  h1{font-size:24px;line-height:1.25;margin-bottom:8px}
  h2{font-size:19px;margin-bottom:6px}
  .sub{font-size:14px;opacity:.65;margin-bottom:20px}
  .arena{position:relative;height:130px;margin-top:18px}
  button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:13px 22px;
         color:#fff;background:#e0446b;transition:transform .15s}
  button:active{transform:scale(.96)}
  #yes{position:absolute;left:50%;top:14px;transform:translateX(-50%);font-size:18px;
       padding:15px 34px;box-shadow:0 8px 24px rgba(224,68,107,.4)}
  #no{position:absolute;left:50%;top:76px;transform:translateX(-50%);
      background:rgba(255,255,255,.12);transition:left .18s,top .18s,transform .18s}
  .grid{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
  .grid.three{grid-template-columns:repeat(3,1fr)}
  .opt{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);
       border-radius:14px;padding:13px 8px;font-size:14px;color:#f6ecec}
  .opt.sel{background:#e0446b;border-color:#e0446b}
  .opt b{display:block;font-size:17px}
  .opt small{opacity:.6}
  .next{margin-top:18px;width:100%;opacity:.35;pointer-events:none}
  .next.ready{opacity:1;pointer-events:auto}
  input{width:100%;margin-top:10px;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.2);
        background:rgba(0,0,0,.25);color:#fff;font:inherit;display:none}
  input.on{display:block}
  .rcpt{text-align:left;background:rgba(0,0,0,.25);border-radius:14px;padding:16px;margin:16px 0;font-size:14px}
  .rcpt div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed rgba(255,255,255,.12)}
  .rcpt div:last-child{border:0;font-size:17px;font-weight:600;padding-top:12px}
  .msg{min-height:22px;font-size:13px;opacity:.75;margin-top:12px}
  .ghost{background:rgba(255,255,255,.12);margin-top:10px;width:100%}
</style>
</head>
<body>

<section class="card on" id="s1">
  <h1>I have a proposal 💌</h1>
  <p class="sub">Read carefully. This is legally binding.</p>
  <h2>Will you go on a date with me?</h2>
  <div class="arena">
    <button id="yes">Yes 💖</button>
    <button id="no">No</button>
  </div>
</section>

<section class="card" id="s2">
  <h1>Knew it 😌</h1>
  <p class="sub">Pick your day</p>
  <div class="grid three" id="days"></div>
  <p class="sub" style="margin:20px 0 10px">Pick a time</p>
  <div class="grid three" id="times"></div>
  <button class="next" id="n2">Continue</button>
</section>

<section class="card" id="s3">
  <h1>Feeding you 🍽️</h1>
  <p class="sub">Choose the cuisine</p>
  <div class="grid" id="food"></div>
  <input id="other" placeholder="Type it out then...">
  <button class="next" id="n3">Continue</button>
</section>

<section class="card" id="s4">
  <h1>Booking confirmed ✅</h1>
  <p class="sub">One last formality</p>
  <div class="rcpt" id="rcpt"></div>
  <button id="pay">Pay $50</button>
  <p class="msg" id="msg"></p>
  <button class="ghost" id="share" style="display:none">Send it to me 📲</button>
</section>

<script>
const CONFIG = {
  price: 50,
  payLink: "",            // leave empty = gag mode. paste a real Venmo/PayPal link to make it real
  whatsapp: ""            // your number, digits only e.g. "919876543210"
};

const pick = {day:"", time:"", food:""};
const $ = id => document.getElementById(id);
const show = id => {document.querySelectorAll('.card').forEach(c=>c.classList.remove('on')); $(id).classList.add('on');};

/* 1. the No button that refuses to be caught */
const no = $('no'), arena = document.querySelector('.arena');
let dodges = 0;
const taunts = ["No","Nope","Sure?","Really?","Try again","Stop","Hmm","Fine, no"];
function dodge(e){
  if(e) e.preventDefault();
  const w = arena.clientWidth - no.offsetWidth, h = arena.clientHeight - no.offsetHeight;
  no.style.transform = "none";
  no.style.left = Math.random()*w + "px";
  no.style.top  = Math.max(60, Math.random()*h) + "px";
  no.textContent = taunts[++dodges % taunts.length];
}
['mouseenter','touchstart','click','pointerdown'].forEach(ev => no.addEventListener(ev, dodge, {passive:false}));
$('yes').onclick = () => show('s2');

/* 2. next 7 days + times */
const days = $('days');
for(let i=1;i<=7;i++){
  const d = new Date(); d.setDate(d.getDate()+i);
  const b = document.createElement('button');
  b.className = 'opt';
  b.innerHTML = `<b>${d.toLocaleDateString('en',{weekday:'short'})}</b><small>${d.getDate()} ${d.toLocaleDateString('en',{month:'short'})}</small>`;
  b.onclick = () => {sel(days,b); pick.day = b.innerText.replace('\n',' '); check2();};
  days.appendChild(b);
}
const times = $('times');
["12:00 PM","1:30 PM","5:00 PM","6:30 PM","8:00 PM","9:30 PM"].forEach(t=>{
  const b = document.createElement('button');
  b.className='opt'; b.textContent=t;
  b.onclick = () => {sel(times,b); pick.time=t; check2();};
  times.appendChild(b);
});
function sel(box,btn){[...box.children].forEach(c=>c.classList.remove('sel')); btn.classList.add('sel');}
function check2(){ $('n2').classList.toggle('ready', !!(pick.day && pick.time)); }
$('n2').onclick = () => show('s3');

/* 3. cuisine */
const food = $('food');
[["🍛","Indian"],["🍣","Japanese"],["🥡","Chinese"],["🍕","Pizza"],["🌮","Tacos"],["✨","Others"]].forEach(([e,n])=>{
  const b = document.createElement('button');
  b.className='opt'; b.innerHTML = `<b>${e}</b>${n}`;
  b.onclick = () => {
    sel(food,b); pick.food = n;
    $('other').classList.toggle('on', n==="Others");
    if(n!=="Others") $('other').value = "";
    $('n3').classList.add('ready');
  };
  food.appendChild(b);
});
$('n3').onclick = () => {
  if(pick.food==="Others" && $('other').value.trim()) pick.food = $('other').value.trim();
  $('rcpt').innerHTML = `
    <div><span>Date</span><span>${pick.day}</span></div>
    <div><span>Time</span><span>${pick.time}</span></div>
    <div><span>Cuisine</span><span>${pick.food}</span></div>
    <div><span>Company</span><span>Your wife 💁‍♀️</span></div>
    <div><span>Total</span><span>$${CONFIG.price}</span></div>`;
  show('s4');
};

/* 4. payment */
const lines = ["Processing...","Card declined 💳","Trying again...","Declined again 😬","Contacting your bank...","They said you're broke","Fine. It's on me 💖"];
let step = 0;
$('pay').onclick = () => {
  if(CONFIG.payLink){ window.open(CONFIG.payLink,'_blank'); return; }
  $('msg').textContent = lines[step];
  if(++step >= lines.length){
    $('pay').style.display = 'none';
    $('msg').textContent = "Just show up. That's the payment. 🌹";
    $('share').style.display = 'block';
  }
};
$('share').onclick = () => {
  const txt = `Date locked 🔒\n${pick.day} at ${pick.time}\nFood: ${pick.food}`;
  if(CONFIG.whatsapp) window.open(`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(txt)}`,'_blank');
  else { navigator.clipboard.writeText(txt); $('msg').textContent = "Copied. Paste it to me 😘"; }
};
</script>
</body>
</html>
